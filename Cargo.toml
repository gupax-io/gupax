cargo-features = ["profile-rustflags", "codegen-backend"]
[package]
name = "gupax"
version = "2.0.1"
authors = ["cyrix126 <contact@gupax.io>"]
description = "GUI uniting P2Pool and XMRig"
documentation = "https://github.com/cyrix126/gupax"
edition = "2024"

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
incremental = false
strip = "symbols"
rustflags = ["-Zlocation-detail=none"]

[profile.dev]
# can induce issue when using rust-analyzer, but allows smaller dev build time
# codegen-backend = "cranelift"

[features]
distro = []
log=[]

[dependencies]
clap = {version="4.6", features=["cargo", "derive"]}
anyhow = "1.0.102"
benri = "0.1.12"
bytes = "1.11.1"
dirs = "6.0.0"
#--------------------------------------------------------------------------------
# egui = "0.33"
egui = {git="https://github.com/emilk/egui", rev="f32727d"}

# egui_extras = {version="0.33", features = ["image"] }
egui_extras = {git="https://github.com/emilk/egui", features = ["image"], rev="f32727d" }
egui_commonmark = {git="https://github.com/Cyrix126/egui_commonmark", features=["better_syntax_highlighting"]}

## 2023-12-28: https://github.com/hinto-janai/gupax/issues/68
##
## 2024-03-18: Both `glow` and `wgpu` seem to crash:
## <https://github.com/hinto-janai/gupax/issues/84>
## `wgpu` seems to crash on less computers though so...

## 2023-02-06: The below gets fixed by using the [wgpu] backend instead of [glow]
## It also fixes crashes on CPU-based graphics. Only used for Windows.
## Using [wgpu] actually crashes macOS (fixed in 0.20.x though).

#--------------------------------------------------------------------------------
env_logger = "0.11.9"
figment = { version = "0.10.19", features = ["toml"] }
reqwest = {version = "0.13.2", default-features=false, features=["json", "default-tls"]}
reqwest-middleware = "0.5"
reqwest-retry = "0.9"
image = { version = "0.25.10", features = ["png"] }
log = "0.4.29"
num-format = { version = "0.4.4", default-features = false }
once_cell = "1.21.4"
rand = "0.10.0"
regex = { version = "1.12.3", default-features = false, features = ["perf"] }
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["rc", "derive"] }
serde_json = "1.0.149"
sysinfo = { version = "0.38", default-features = false, features=["system"] }
# tls-api = "0.9.0"
tokio = { version = "1.50.0", features = ["rt", "time", "macros", "process", "rt-multi-thread"] }
toml = { version = "1.0.6", features = ["preserve_order"] }
walkdir = "2.5.0"
copy_dir = {git="https://github.com/decathorpe/copy_dir", rev="7541d89"}
zeroize = "1.8.2"
strsim = "0.11.1"
strip-ansi-escapes = "0.2.1"
derive_more = {version="2.1.1", default-features=false, features=["display", "deref", "deref_mut"]}
serde-this-or-that = "0.5.0"
readable = "0.16"
chrono = {version="0.4", default-features=false, features=["clock", "std", "serde"]}
enclose = "1.2.1"
bounded-vec-deque = {version="0.1.1", default-features=false}
cfg-if = "1.0"
flexi_logger = "0.31"
# eframe = {version="0.33", features=["wgpu"]}
eframe = {git="https://github.com/emilk/egui", features=["wgpu", "glow"], rev="f32727d"}
strum = {version="0.28", features=["derive"]}
## force version of ring to prevent https://rustsec.org/advisories/RUSTSEC-2025-0009
ring = "0.17.14"
## get local ip
local-ip-address = "0.6"
## get public ip
public-ip = {git="https://github.com/Cyrix126/rust-public-ip"}
## check if port open
port_check = "0.3"
## node crawler
monero-crawler-lib = {git="https://github.com/Cyrix126/monero-crawler-rs", features=["rpc", "zmq"]}
futures = "0.3"
## find ports used by a local monerod
listeners = "0.5"
## notifications
notify-rust = "4.12"
## handle Ctrl+C for daemon mode
ctrlc = {version="3.5", features=["termination"]}

tokio-stream = {version = "0.1", default-features=false}
thiserror = "2.0"

# System tray
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.24"
[target.'cfg(target_os = "linux")'.dependencies]
# async-io backend: ksni runs its own reactor thread, no ambient tokio runtime needed
ksni = {version="0.3", default-features=false, features=["blocking", "async-io"]}

# Unix dependencies
[target.'cfg(unix)'.dependencies]
bzip2-rs = "0.1"
tar = "0.4.44"
flate2 = "1.1"
sudo = "0.6.0"
# https://github.com/emilk/egui/releases/tag/0.30.0 see breaking change
# eframe = {version="0.33", features=["x11", "wayland"]}
eframe = {git="https://github.com/emilk/egui", features=["x11", "wayland", "glow", "wgpu"], rev="f32727d"}
# macOS
[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.31", features = ["fs"] }
## activation-policy handling, see src/tray/macos.rs
## (winit must match the version eframe links)
winit = "0.30"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  ## NSApplication itself is gated on NSResponder, and the activation
  ## policy getter/setter on NSRunningApplication
  "NSResponder",
  "NSApplication",
  "NSRunningApplication",
] }
[dev-dependencies]
# egui = {version="0.33", features=["callstack"]}
egui = {git="https://github.com/emilk/egui", rev="f32727d", features=["callstack"]}
# egui = {git="https://github.com/emilk/egui", features=["callstack"]}


# Windows dependencies
[target.'cfg(windows)'.dependencies]
zip = "8.2.0"
windows = {version="0.62.2", features=["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"]}
is_elevated = "0.1.2"
elevated-helper = {git="https://github.com/Cyrix126/elevated-helper"}
uuid = "1.22"
conpty = "0.7"
# to get the HWND of the main window for the tray (same version as eframe/winit)
raw-window-handle = "0.6"

# For Windows build (icon)
[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"
static_vcruntime = "3.0"

# For macOS build (cargo-bundle)
[package.metadata.bundle]
name = "Gupax"
identifier = "com.github.cyrix126.gupax"
icon = ["images/icons/icon@2x.png"]
category = "public.app-category.utilities"

## Clippy
[lints.clippy]
result_large_err = "allow"
