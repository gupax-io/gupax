# Runs the tests once on a branch that the Rust workflow does not cover.

name: Gupax gone check

on:
  push:
    branches: [ "gupax-gone-check" ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, ubuntu-latest, windows-latest ]
    steps:
    - uses: actions/checkout@v4
    - name: Test
      run: cargo test
